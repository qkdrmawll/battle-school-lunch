services:
  backend:
    build:
      context: ./backend
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-sample}
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

