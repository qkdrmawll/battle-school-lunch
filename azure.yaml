# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: battle-school-lunch
metadata:
    template: azd-init@1.30.0
services:
    backend:
        project: backend
        host: containerapp
        language: python
        docker:
            path: Dockerfile
    frontend:
        project: frontend
        host: containerapp
        language: ts
        dist: dist
        docker:
            path: Dockerfile
resources:
    backend:
        type: host.containerapp
        port: 8000
    frontend:
        type: host.containerapp
        uses:
            - backend
        port: 8080
