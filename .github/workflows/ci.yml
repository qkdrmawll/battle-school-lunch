name: CI and Azure deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm ci
      - name: Build
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm run build --if-present
      - name: Test
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm test --if-present
      - name: Await frontend scaffold
        if: ${{ hashFiles('frontend/package-lock.json') == '' }}
        run: echo "frontend/package-lock.json is not present yet; skipping TypeScript checks."

  backend:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements*.txt
      - name: Install dependencies
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Test
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        working-directory: backend
        run: pytest
      - name: Await backend scaffold
        if: ${{ hashFiles('backend/pyproject.toml') == '' }}
        run: echo "backend/pyproject.toml is not present yet; skipping Python checks."

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') != '' }}
        run: docker compose config
      - name: Await Compose scaffold
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') == '' }}
        run: echo "No Compose file is present yet; skipping configuration validation."

  deploy:
    name: Azure
    if: ${{ github.event_name != 'pull_request' }}
    needs: [frontend, backend, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      SERVICE_BACKEND_RESOURCE_EXISTS: ${{ vars.SERVICE_BACKEND_RESOURCE_EXISTS }}
      SERVICE_FRONTEND_RESOURCE_EXISTS: ${{ vars.SERVICE_FRONTEND_RESOURCE_EXISTS }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2
      - name: Log in to Azure
        shell: pwsh
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider github `
            --tenant-id "$Env:AZURE_TENANT_ID"
      - name: Provision infrastructure
        run: azd provision --no-prompt
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      - name: Deploy application
        run: azd deploy --no-prompt
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
